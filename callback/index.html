<!DOCTYPE html>
<html>
<head>
    <title>Torna a Wealth Tracker AI</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .card { 
            max-width: 440px; 
            margin: 0 auto; 
            background: #1e293b; 
            padding: 32px 24px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            border: 1px solid #334155;
        }
        .icon { font-size: 48px; margin-bottom: 12px; }
        .btn { 
            background-color: #06b6d4; 
            color: #042f2e; 
            padding: 16px 32px; 
            text-decoration: none; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: 700; 
            display: inline-block; 
            margin-top: 24px; 
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:hover { background-color: #22d3ee; }
        .btn:active { transform: scale(0.97); }
        .hint { color: #94a3b8; font-size: 14px; margin-top: 16px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚀</div>
        <h2 style="margin-top:0;">Autenticazione Completata!</h2>
        <p>Stiamo tornando a <strong>Wealth Tracker AI</strong>...</p>
        <p class="hint">Se l'applicazione non si è aperta automaticamente, tocca il pulsante qui sotto:</p>
        
        <a id="backLink" href="#" class="btn">Apri Wealth Tracker AI</a>
    </div>

    <script>
        var currentUrl = window.location.href;
        var queryString = window.location.search; // cattura il parametro ?code=...
        
        // Link per il tocco manuale tramite custom scheme
        var customSchemeUrl = "wealthtracker://callback" + queryString;
        document.getElementById('backLink').href = customSchemeUrl;
        
        // 1. Reindirizzamento immediato via custom scheme registrato nell'app
        window.location.href = customSchemeUrl;
        
        // 2. Fallback via Intent Android esplicito con nuovo package name
        setTimeout(function() {
            var intentUrl = currentUrl.replace("https://", "intent://") + "#Intent;scheme=https;package=com.fintech.wealthtracker;end";
            window.location.href = intentUrl;
        }, 600);
    </script>
</body>
</html>
